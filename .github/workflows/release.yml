name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (on Ubuntu via cargo-xwin)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install cross-compilation & packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis lld clang zip
          cargo install cargo-xwin --locked

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-msvc

      - name: Build Windows release binary
        run: cargo xwin build --release --locked --target x86_64-pc-windows-msvc

      - name: Package Windows portable zip and installer
        run: |
          VERSION="${{ github.ref_name }}"
          BIN_PATH="target/x86_64-pc-windows-msvc/release/fast-md.exe"

          # 1. Portable ZIP (used by in-app self-updater)
          mkdir -p staging-portable
          cp "$BIN_PATH" staging-portable/
          cp README.md LICENSE staging-portable/
          cd staging-portable
          zip -r "../fast-md-$VERSION-windows-x86_64.zip" *
          cd ..
          shasum -a 256 "fast-md-$VERSION-windows-x86_64.zip" > "fast-md-$VERSION-windows-x86_64.zip.sha256"

          # 2. Setup Installer (.exe)
          makensis -DPRODUCT_VERSION="$VERSION" \
                   -DOUT_FILE="fast-md-$VERSION-windows-x86_64-setup.exe" \
                   -DBIN_PATH="$BIN_PATH" \
                   packaging/windows/installer.nsi
          shasum -a 256 "fast-md-$VERSION-windows-x86_64-setup.exe" > "fast-md-$VERSION-windows-x86_64-setup.exe.sha256"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-windows
          path: |
            fast-md-*-windows-x86_64.zip
            fast-md-*-windows-x86_64.zip.sha256
            fast-md-*-windows-x86_64-setup.exe
            fast-md-*-windows-x86_64-setup.exe.sha256
          if-no-files-found: error

  build-macos:
    name: Build macOS
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          key: aarch64-apple-darwin

      - name: Build release binary
        run: cargo build --release --locked --target aarch64-apple-darwin

      - name: Package macOS artifact
        run: |
          VERSION="${{ github.ref_name }}"
          STAGING="staging-macos"
          mkdir -p "$STAGING/Fast-MD.app/Contents/MacOS"
          mkdir -p "$STAGING/Fast-MD.app/Contents/Resources"
          cp "target/aarch64-apple-darwin/release/fast-md" "$STAGING/Fast-MD.app/Contents/MacOS/"
          cp "target/aarch64-apple-darwin/release/fast-md" "$STAGING/"
          cp README.md LICENSE "$STAGING/"
          sed "s/APP_VERSION/$VERSION/g" src/assets/Info.plist > "$STAGING/Fast-MD.app/Contents/Info.plist"
          tar -czvf "fast-md-$VERSION-macos-arm64.tar.gz" -C "$STAGING" "Fast-MD.app" "fast-md" "README.md" "LICENSE"
          shasum -a 256 "fast-md-$VERSION-macos-arm64.tar.gz" > "fast-md-$VERSION-macos-arm64.tar.gz.sha256"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-macos
          path: |
            fast-md-*-macos-arm64.tar.gz
            fast-md-*-macos-arm64.tar.gz.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Display downloaded assets
        run: ls -la release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
