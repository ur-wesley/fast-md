name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: fast-md.exe
            archive_ext: zip
            artifact_name: fast-md-${{ github.ref_name }}-windows-x86_64.zip
          - os: macos-14
            target: aarch64-apple-darwin
            bin_name: fast-md
            archive_ext: tar.gz
            artifact_name: fast-md-${{ github.ref_name }}-macos-arm64.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package release artifact (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $binPath = "target/${{ matrix.target }}/release/${{ matrix.bin_name }}"
          $archive = "${{ matrix.artifact_name }}"
          $staging = "staging-windows"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item $binPath -Destination "$staging/${{ matrix.bin_name }}"
          Copy-Item "README.md" -Destination "$staging/README.md"
          Copy-Item "LICENSE" -Destination "$staging/LICENSE"
          Compress-Archive -Path "$staging/*" -DestinationPath $archive -Force
          $hash = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLower()
          "$hash  $archive" | Out-File -FilePath "$archive.sha256" -Encoding ASCII

      - name: Package release artifact (macOS)
        if: matrix.os != 'windows-latest'
        run: |
          STAGING="staging-macos"
          mkdir -p "$STAGING"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "$STAGING/"
          cp "README.md" "$STAGING/"
          cp "LICENSE" "$STAGING/"
          tar -czvf "${{ matrix.artifact_name }}" -C "$STAGING" "${{ matrix.bin_name }}" "README.md" "LICENSE"
          shasum -a 256 "${{ matrix.artifact_name }}" > "${{ matrix.artifact_name }}.sha256"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.target }}
          path: |
            ${{ matrix.artifact_name }}
            ${{ matrix.artifact_name }}.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Display downloaded assets
        run: ls -la release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
